<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TOEFL Certificate</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #fff;
      padding: 50px;
    }
    
    .certificate {
      width: 1123px;
      height: 794px;
      box-sizing: border-box;
      padding: 40px;
      margin: auto;
    }

    .certificate .border-inner {
      border: 5px solid #097292;
      padding: 40px;
    }

    .title {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: #0b3050;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .content {
      text-align: center;
      margin-top: 20px;
    }

    .content h2 {
      font-size: 26px;
      color: #00264d;
    }

    .content p {
      font-size: 18px;
    }

    .scores {
      margin-top: 40px;
      text-align: center;
      font-size: 18px;
    }

    .scores table {
      margin: auto;
      border-collapse: collapse;
    }

    .scores td {
      padding: 8px 20px;
      font-size: 18px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 50px;
      padding: 0 50px;
      font-size: 16px;
    }

    .footer .left,
    .footer .right {
      text-align: center;
    }

    .footer .signature {
      margin-top: 50px;
      border-top: 1px solid #000;
    }

    @media print {
      body {
        padding: 0;
        margin: 0;
      }

      @page {
        size: A4 landscape;
        margin: 0;
      }

      .certificate {
        width: 100%;
        height: 100%;
        transform: scale(0.95); 
        transform-origin: top left;
      }
    }
  </style>
</head>
<body onload="loadCertificateData()">
  <div class="certificate">
    <div class="border-inner">
      <div class="title">E-Certificate of Achievement</div>
      <div class="content">
        <p>This is to certify that</p>
        <h2 id="cert-name">[Nama Mahasiswa]</h2>
        <p>has achieved the following scores on the</p>
        <p><em>TOEFL Prediction Test</em></p>
      </div>

      <div class="scores">
        <table>
          <tr><td>Listening</td><td>:</td><td id="cert-listening">-</td></tr>
          <tr><td>Structure & Written Expression</td><td>:</td><td id="cert-structure">-</td></tr>
          <tr><td>Reading</td><td>:</td><td id="cert-reading">-</td></tr>
          <tr><td><strong>Total</strong></td><td>:</td><td id="cert-total"><strong>-</strong></td></tr>
        </table>
      </div>

      <div class="footer">
        <div class="left">
          <p><strong>Date:</strong> <span id="cert-date">-</span></p>
          <p>Online Test</p>
        </div>
        <div class="right">
          <p><strong>Kurniawan Eka Permana, S.Kom.,M.Sc</strong></p>
          <div class="signature">Head of Project</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function loadCertificateData() {
      document.getElementById("cert-name").textContent = localStorage.getItem("userName") || "Nama Peserta";
      document.getElementById("cert-listening").textContent = localStorage.getItem("certListening") || "-";
      document.getElementById("cert-structure").textContent = localStorage.getItem("certStructure") || "-";
      document.getElementById("cert-reading").textContent = localStorage.getItem("certReading") || "-";
      document.getElementById("cert-total").textContent = localStorage.getItem("certTotal") || "-";
      const rawDate = localStorage.getItem("certDate") || new Date().toISOString();
      document.getElementById("cert-date").textContent = new Date(rawDate).toLocaleDateString("id-ID", {
        day: 'numeric', month: 'long', year: 'numeric'
      });
      window.print();
    }

    window.onafterprint = () => window.close();
  </script>
</body>
</html>
